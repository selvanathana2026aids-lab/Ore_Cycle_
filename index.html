<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OreCycle – Smarter Mining. Greener Tomorrow.</title>
<style>
:root{--forest:#123B32;--em:#159B62;--lime:#B9E66C;--aqua:#E5F6F0;--navy:#183842;--orange:#F08A24;--blue:#2F7CC4;--purple:#7B5BD6;--bg:#F6FAF8;--line:#D5E6DF;--muted:#5C7770;--red:#C0392B;--warn:#B7791F}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif;color:var(--navy);background:var(--bg)}
h1{font-size:26px;margin:0 0 4px;color:var(--forest)}h2{font-size:18px;margin:0 0 10px;color:var(--forest)}h3{font-size:15px;margin:14px 0 6px}
a{color:var(--em)}code{background:var(--aqua);padding:1px 5px;border-radius:4px;font-size:.9em}
.app{display:flex;min-height:100vh}
nav.side{width:232px;background:var(--forest);color:#fff;padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 14px}.brand b{font-size:20px}.brand small{display:block;color:var(--lime);font-size:11px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--lime);display:grid;place-items:center;color:var(--forest);font-weight:800}
nav.side a{display:block;color:#CFE8DE;text-decoration:none;padding:9px 12px;border-radius:8px;margin:2px 0}
nav.side a:hover{background:#1c5245}nav.side a.on{background:var(--em);color:#fff;font-weight:600}
main{flex:1;min-width:0}.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 24px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top select{max-width:340px}.sp{flex:1}.content{padding:22px 24px 60px;max-width:1280px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;border-left:5px solid var(--em)}.stat .v{font-size:24px;font-weight:700;color:var(--forest)}.stat .l{color:var(--muted);font-size:13px}
.hero{background:linear-gradient(120deg,var(--forest),#1d6b52);color:#fff;border-radius:14px;padding:26px;margin-bottom:18px}.hero h1{color:#fff;font-size:30px}.hero p{color:#D9F2E7;max-width:680px}
.btn{background:var(--em);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}.btn:hover{filter:brightness(1.08)}
.btn.sec{background:#fff;color:var(--forest);border:1px solid var(--line)}.btn.dan{background:var(--red)}.btn.sm{padding:4px 9px;font-size:13px}.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid #BCD3CA;border-radius:8px;background:#fff;color:var(--navy);max-width:100%}
input:focus,select:focus,button:focus-visible,a:focus-visible,textarea:focus{outline:3px solid #8fd6b4;outline-offset:1px}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:3px}.f{margin-bottom:10px}.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:var(--aqua);color:var(--forest);font-size:13px;white-space:nowrap}td.n,th.n{text-align:right}
.tw{overflow:auto;max-width:100%}.ed td{padding:3px}.ed input,.ed select{width:100%;min-width:80px;padding:5px 6px}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:#E3EDE9;color:var(--forest);white-space:nowrap}
.badge.demo{background:#FFE9C7;color:#8a5200;font-weight:700}.badge.ok{background:#D6F3E4}.badge.bad{background:#FBD9D5;color:#8c1d12}.badge.warn{background:#FFF0C2;color:#7a5600}
.alert{border-radius:10px;padding:10px 14px;margin:10px 0;border:1px solid;background:#EEF7FF;border-color:#BBD7F2}.alert.warn{background:#FFF7E0;border-color:#F0D58A}.alert.err{background:#FDECEA;border-color:#F0B5AE}.alert.demo{background:#FFF1DA;border-color:#F4C57A}.alert.ok{background:#E6F7EE;border-color:#A8DDBF}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.steps button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;cursor:pointer;font:inherit}.steps button.on{background:var(--em);color:#fff;border-color:var(--em)}.steps button.done{background:var(--aqua)}
.muted{color:var(--muted)}.small{font-size:13px}.num{text-align:right}
.chat{max-height:420px;overflow:auto;display:flex;flex-direction:column;gap:10px}.bub{padding:10px 13px;border-radius:12px;max-width:88%}.bub.me{background:var(--em);color:#fff;align-self:flex-end}.bub.bot{background:var(--aqua)}
.chip{border:1px solid var(--em);background:#fff;color:var(--forest);border-radius:99px;padding:5px 12px;cursor:pointer;font:inherit;font-size:13px}.chip:hover{background:var(--aqua)}
.bg{position:fixed;inset:0;background:rgba(10,30,25,.5);display:grid;place-items:center;z-index:50;padding:14px}.modal{background:#fff;border-radius:14px;padding:20px;max-width:760px;width:100%;max-height:92vh;overflow:auto}
#toast{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:99}#toast div{background:var(--forest);color:#fff;padding:10px 16px;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.25)}#toast div.err{background:var(--red)}
.bar{height:10px;background:#E3EDE9;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--em)}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:6px}.leg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:5px}
svg text{font-family:inherit}.empty{text-align:center;padding:30px;color:var(--muted)}
body.beginner [data-expert]{display:none!important}body.expert [data-beginner]{display:none!important}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}.toggle button{border:0;background:#fff;padding:5px 12px;cursor:pointer;font:inherit}.toggle button.on{background:var(--forest);color:#fff}
.report h2{border-bottom:2px solid var(--lime);padding-bottom:4px;margin-top:22px}
@media(max-width:820px){.app{display:block}nav.side{width:100%;height:auto;position:static;display:flex;flex-wrap:wrap;gap:4px}.brand{width:100%}nav.side a{padding:6px 10px}.top{position:static}.content{padding:14px}}
@media print{nav.side,.top,.noprint,#toast{display:none!important}.app{display:block}.content{padding:0;max-width:none}.card{border:0;padding:0;break-inside:avoid}body{background:#fff}}
</style>
</head>

 $('#ld').onclick=()=>{DEMO0.forEach(d=>{if(!S.assessments.some(a=>a.is_demo&&a.assessment.title===d.assessment.title))S.assessments.push({...JSON.parse(JSON.stringify(d)),id:S.nid++,is_demo:true,scenarios:[],created_at:new Date().toISOString()})});FACTORS0.forEach(f=>{if(!S.factors.some(x=>x.is_active&&x.category===f.category&&x.factor_key===f.factor_key&&x.qualifier===f.qualifier&&x.verification_status==='demo_only'))S.factors.push({...f,id:S.nfid++,version:1,is_active:true,created_at:new Date().toISOString()})});S.active=S.active||S.assessments[0]?.id;save();toast('Demo data loaded.');render()};
 $('#rd').onclick=async()=>{if(!await confirmBox('Remove demo data?','Fictional demo assessments and unused DEMO ONLY factors are removed. Your own data is not touched.','Remove'))return;S.assessments=S.assessments.filter(a=>!a.is_demo);if(!S.assessments.some(a=>a.id===S.active))S.active=S.assessments[0]?.id||null;const keep=S.assessments.some(a=>calc(a).items.some(i=>i.f&&i.f.verification_status==='demo_only'));if(!keep)S.factors=S.factors.filter(f=>f.verification_status!=='demo_only');save();toast('Demo data removed.');render()};
 $('#bx').onclick=()=>download('orecycle_backup.json',JSON.stringify(S),'application/json');
 $('#bi').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!j||j.v!==1||!Array.isArray(j.assessments)||!Array.isArray(j.factors))throw 0;S=j;save();toast('Backup restored.');render()}catch(x){toast('That file is not a valid OreCycle backup.','err')}};
 $('#rs').onclick=async()=>{if(await confirmBox('Reset everything?','All assessments, factors and settings on this device will be erased and demo data restored.','Reset')){S=seed();save();toast('Reset.');render()}}}

const WIRE={new:wizardWire,assessments:wireAssess,whatif:wireWhatif,assistant:wireAssistant,factors:wireFactors,reports:wireReports,settings:wireSettings,dashboard:()=>{const a=$('#df1');if(a){a.onchange=()=>{dashFilter.cat=a.value;render()};$('#df2').onchange=e=>{dashFilter.stage=e.target.value;render()}}}};

 $$('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.p===k));fillPick();
 try{$('#view').innerHTML=V[k]();WIRE[k]&&WIRE[k]()}catch(e){console.error(e);$('#view').innerHTML=`<div class="alert err"><b>Something went wrong showing this page.</b> Your data is safe. Try another page or reload.</div>`}}
window.addEventListener('hashchange',()=>{render();$('#view').focus();window.scrollTo(0,0)});
setMode(S.mode||'beginner');render();
